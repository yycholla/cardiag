[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiag"
dynamic = ["version"]
description = "Car diagnostics over OBD-II for Linux: trouble codes, live data, session logging"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cardiag = "cardiag.cli:main"

[tool.setuptools.dynamic]
version = {attr = "cardiag.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardiag = ["web/*", "web/glasses/*", "web/glasses/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
