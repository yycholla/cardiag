# Drop-in for cardiag.service on the central server: no adapter, no Wi-Fi switching.
# It listens on this machine only; Tailscale ("tailscale serve") puts it on the tailnet.
[Service]
SupplementaryGroups=
ExecStart=
ExecStart=/usr/local/bin/cardiag serve --host 127.0.0.1 --accept-uploads --update-dir /opt/cardiag
